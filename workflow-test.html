    // Setup canvas avec DPR
    const wrap   = document.getElementById('canvas-wrap');
    const canvas = document.getElementById('c');
    let isDark   = true;

    function setupCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width  = wrap.clientWidth  * dpr;
      canvas.height = wrap.clientHeight * dpr;
    }

    setupCanvas();

    const wc = new AgentivityWorkflowCanvas(canvas, WORKFLOW, { darkMode: isDark });

    // Boutons
    document.getElementById('btn-fit').onclick    = () => wc.fitToScreen();
    document.getElementById('btn-saved').onclick  = () => {
      const vp = WORKFLOW.metadata.editorViewport;
      const dpr = window.devicePixelRatio || 1;
      wc.setViewport(vp.x * dpr, vp.y * dpr, vp.zoom);
    };
    document.getElementById('btn-dark').onclick   = () => {
      isDark = !isDark;
      document.getElementById('btn-dark').textContent = isDark ? '☀ Light' : '🌙 Dark';
      document.body.style.background = isDark ? '#13151a' : '#f0f2f5';
      wc.setDarkMode(isDark);
    };
    document.getElementById('btn-sim').onclick = () => {
      wc.simulate = !wc.simulate;
      document.getElementById('btn-sim').textContent = wc.simulate ? '⏹ Stop' : '▶ Simulate';
    };

    // Titre
    document.getElementById('title').textContent = WORKFLOW.name;

    // Resize
    const ro = new ResizeObserver(() => {
      setupCanvas();
      wc.render();
    });
    ro.observe(wrap);
